<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Paige Rattenberry">
  <!--
    Three iso-lines of the hero's scalar field, reduced to a 32 px mark (DESIGN §4.3), so the
    tab icon is the same motif as the home page rather than a monogram. Light palette by
    default; the dark tokens under prefers-color-scheme match [data-theme="dark"] in globals.css.
    Replaces the create-next-app stock icon, which shipped Vercel's mark on Paige's tabs.
  -->
  <style>
    :root { --bg: #f5f4ef; --fg: #0e6b6b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12171c; --fg: #45c7be; } }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--bg)" />
  <g fill="none" stroke="var(--fg)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 23.5c1.6-5.4 5-8.6 10.2-9.6 3.7-.7 6.5-2.6 8.4-5.6" stroke-width="1.7" />
    <path d="M6 17.6c1.2-3.2 3.5-5.1 6.9-5.8 2.9-.6 5-1.9 6.4-4" stroke-width="1.1" opacity=".75" />
    <path d="M6.4 11.9c1-1.5 2.4-2.5 4.3-3 1.6-.4 2.8-1 3.6-1.9" stroke-width="1.1" opacity=".5" />
  </g>
</svg>
